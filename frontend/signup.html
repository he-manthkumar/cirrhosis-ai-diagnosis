<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Cirrhosis AI Diagnosis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="auth-top-nav">
        <button type="button" id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>
    <div class="auth-shell">
        <div class="auth-wrap">
            <section class="auth-hero">
                <h1>Create Your Account</h1>
                <p>Create your account to start liver cirrhosis assessments, compare follow-up outcomes, and monitor risk progression.</p>
                <div class="auth-badges">
                    <span class="auth-badge">Mortality risk interpretation</span>
                    <span class="auth-badge">Patient timeline tracking</span>
                    <span class="auth-badge">Clinical narrative support</span>
                </div>
            </section>

            <section class="auth-card">
                <h2>Signup</h2>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" placeholder="Choose username">
                </div>
                <div class="form-group" style="margin-top: 12px;">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Choose password">
                </div>
                <div class="auth-actions">
                    <button id="signupBtn" class="submit-btn">Create Account</button>
                </div>
                <p id="authStatus" class="auth-status"></p>
                <p class="auth-link">
                    Already have account? <a href="login.html">Login</a>
                </p>
            </section>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="auth.js"></script>
</body>

</html>
