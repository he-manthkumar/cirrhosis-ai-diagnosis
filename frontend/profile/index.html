<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Cirrhosis AI Diagnosis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="container">
        <nav class="top-nav">
            <div class="top-nav-brand">Cirrhosis AI</div>
            <div class="top-actions">
                <button type="button" id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <a href="../index.html" class="icon-btn" aria-label="Dashboard" title="Dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </a>
            </div>
        </nav>

        <section class="card profile-page-card">
            <h2 class="card-title">Profile</h2>
            <div class="profile-meta" style="margin-bottom: 14px;">
                <p><strong>User:</strong> <span id="profileUsername">-</span></p>
                <p><strong>Session:</strong> Authenticated</p>
            </div>

            <section class="history-section" style="margin-top: 14px;">
                <h4 style="margin-bottom: 8px;">Prediction History</h4>
                <div class="search-bar">
                    <input type="text" id="search_name" placeholder="Enter Patient Name to search past reports">
                    <button type="button" id="searchHistoryBtn" class="submit-btn">Search</button>
                </div>
                <div id="historyResults" style="display: none;"></div>
            </section>

            <button type="button" id="logoutBtn" class="submit-btn" style="margin-top: 18px;">Logout</button>
        </section>
    </div>

    <script src="../theme.js"></script>
    <script src="profile.js"></script>
</body>

</html>
